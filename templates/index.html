<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ScamShield AI - Protecting India, one message at a time</title>

  <!-- CSS -->
  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <h1 class="logo">

      <!-- Custom SVG Shield -->
      <svg class="shield-icon"
           xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 64 64">

        <defs>
          <linearGradient id="shieldGradient"
                          x1="0%"
                          y1="0%"
                          x2="100%"
                          y2="100%">

            <stop offset="0%" stop-color="#1F51FF" />
            <stop offset="100%" stop-color="#00CFFF" />

          </linearGradient>
        </defs>

        <path
          d="M32 2l26 10v18c0 16-11 30-26 32-15-2-26-16-26-32V12z"
          fill="url(#shieldGradient)"
          stroke="#00CFFF"
          stroke-width="3"
        />

      </svg>

      ScamShield AI

    </h1>


    <!-- Navigation -->

    <nav>

      <a href="{{ url_for('index') }}"
         class="active">
        Home
      </a>

      <a href="{{ url_for('about') }}">
        About
      </a>

      <a href="{{ url_for('blog') }}">
        Blog
      </a>

      <a href="{{ url_for('contact') }}">
        Contact
      </a>

      <button id="signup-toggle">
        Sign Up
      </button>

    </nav>

  </header>


  <!-- ================= SIGN UP MODAL ================= -->

  <div id="signup-modal"
       class="signup-modal">

    <div class="signup-content">

      <span id="close-signup"
            class="close-btn">
        &times;
      </span>

      <h2>Create Your Account</h2>

      <form id="signup-form">

        <input
          type="text"
          placeholder="Full Name"
          required
        >

        <input
          type="email"
          placeholder="Email Address"
          required
        >

        <input
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Sign Up
        </button>

      </form>

    </div>

  </div>


  <!-- ================= HERO SECTION ================= -->

  <section class="hero">


    <!-- LEFT SIDE -->

    <div class="hero-text">

      <h2>
        Is this Website Safe?
      </h2>

      <p>
        Analyze suspicious URLs and detect scams instantly.
      </p>


      <!-- URL INPUT -->

      <input
        type="text"
        id="url-input"
        placeholder="Enter URL to scan..."
        autocomplete="off"
      >


      <button
        type="button"
        id="scan-btn">
        Scan Now
      </button>


      <!-- ================= RISK METER ================= -->

      <div class="risk-meter">

        <h3>
          Risk Score:
          <span id="score">0</span>
        </h3>


        <div class="meter">

          <div id="meter-fill">
          </div>

        </div>


        <p id="risk-level">
          Awaiting scan
        </p>

      </div>

    </div>


    <!-- ================= RIGHT SIDE ================= -->

    <div class="hero-right">

      <div class="doodle">

        <img
          src="{{ url_for('static', filename='doodle.png') }}"
          alt="ScamShield AI Doodle"
        >

      </div>

    </div>


  </section>


  <!-- ================= FOOTER ================= -->

  <footer>

    <p>
      © 2026 ScamShield AI.
      Protecting India, one message at a time.
    </p>

  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script
    src="{{ url_for('static', filename='script.js') }}">
  </script>


</body>
</html>
