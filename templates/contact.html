<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact - ScamShield AI</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <h1 class="logo">

      <svg
        class="shield-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
      >

        <defs>
          <linearGradient
            id="shieldGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#1F51FF" />
            <stop offset="100%" stop-color="#00CFFF" />
          </linearGradient>
        </defs>

        <path
          d="M32 2l26 10v18c0 16-11 30-26 32-15-2-26-16-26-32V12z"
          fill="url(#shieldGradient)"
          stroke="#00CFFF"
          stroke-width="3"
        />

      </svg>

      ScamShield AI

    </h1>


    <!-- Navigation -->

    <nav>

      <a href="{{ url_for('index') }}">
        Home
      </a>

      <a href="{{ url_for('about') }}">
        About
      </a>

      <a href="{{ url_for('blog') }}">
        Blog
      </a>

      <a
        href="{{ url_for('contact') }}"
        class="active"
      >
        Contact
      </a>

      <button id="signup-toggle">
        Sign Up
      </button>

    </nav>

  </header>


  <!-- ================= SIGN UP MODAL ================= -->

  <div
    id="signup-modal"
    class="signup-modal"
  >

    <div class="signup-content">

      <span
        id="close-signup"
        class="close-btn"
      >
        &times;
      </span>

      <h2>Create Your Account</h2>

      <form id="signup-form">

        <input
          type="text"
          placeholder="Full Name"
          required
        >

        <input
          type="email"
          placeholder="Email Address"
          required
        >

        <input
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Sign Up
        </button>

      </form>

    </div>

  </div>


  <!-- ================= CONTACT SECTION ================= -->

  <section class="contact">

    <div class="contact-container">

      <h2>Contact ScamShield AI</h2>

      <p>
        Have a question, feedback, or found a suspicious website?
        Send us a message.
      </p>


      <form
        id="contact-form"
        class="contact-form"
      >

        <input
          type="text"
          id="contact-name"
          placeholder="Your Name"
          required
        >

        <input
          type="email"
          id="contact-email"
          placeholder="Your Email"
          required
        >

        <input
          type="text"
          id="contact-subject"
          placeholder="Subject"
          required
        >

        <textarea
          id="contact-message"
          rows="6"
          placeholder="Write your message..."
          required
        ></textarea>

        <button type="submit">
          Send Message
        </button>

      </form>

    </div>

  </section>


  <!-- ================= FOOTER ================= -->

  <footer>

    <p>
      © 2026 ScamShield AI.
      Protecting India, one message at a time.
    </p>

  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script
    src="{{ url_for('static', filename='script.js') }}">
  </script>

</body>

</html>
